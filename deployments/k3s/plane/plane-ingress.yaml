apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plane-http-body-limit
  namespace: plane
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane
spec:
  buffering:
    maxRequestBodyBytes: 20971520
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plane-god-mode-path
  namespace: plane
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane
spec:
  redirectRegex:
    regex: ^(https?://[^/]+/god-mode)$
    replacement: ${1}/
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plane-http
  namespace: plane
  labels:
    app.kubernetes.io/name: plane
    app.kubernetes.io/part-of: plane
spec:
  entryPoints:
    - web
  routes:
    # The admin container redirects /god-mode to its internal :3000 port.
    # Redirect the exact path at the edge so nginx cannot expose port 3000.
    - match: (Host(`work.localhost`) || Host(`work.local`)) && Path(`/god-mode`)
      kind: Rule
      priority: 200
      middlewares:
        - name: plane-http-body-limit
        - name: plane-god-mode-path
      services:
        - name: plane-app-admin
          port: 3000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/spaces`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-space
          port: 3000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/god-mode`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-admin
          port: 3000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-api
          port: 8000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/auth`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-api
          port: 8000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/live`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-live
          port: 3000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/uploads`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-minio
          port: 9000
    - match: (Host(`work.localhost`) || Host(`work.local`)) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: plane-http-body-limit
      services:
        - name: plane-app-web
          port: 3000
