apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-mcp
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-mcp
    app.kubernetes.io/part-of: plane
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-mcp
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-mcp
    app.kubernetes.io/part-of: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-mcp
        app.kubernetes.io/part-of: plane
    spec:
      serviceAccountName: plane-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: makeplane/plane-mcp-server:v0.2.11@sha256:1feb49a963de0e3e3a2178cd86c4b388c19ef7fddfd15a95f81f6bd71cb7a95e
          imagePullPolicy: IfNotPresent
          args:
            - http
          env:
            - name: PLANE_BASE_URL
              value: http://work.local
            - name: PLANE_INTERNAL_BASE_URL
              value: http://plane-app-api.plane.svc.cluster.local:8000
            - name: PLANE_OAUTH_PROVIDER_BASE_URL
              # FastMCP requires an HTTPS issuer URL even when this local
              # deployment only uses the separate API-key endpoint.
              value: https://mcp.work.local
            - name: PLANE_OAUTH_PROVIDER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: plane-runtime-mcp
                  key: PLANE_OAUTH_PROVIDER_CLIENT_ID
            - name: PLANE_OAUTH_PROVIDER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: plane-runtime-mcp
                  key: PLANE_OAUTH_PROVIDER_CLIENT_SECRET
            - name: PLANE_OAUTH_PROVIDER_ENABLE_CIMD
              value: "false"
            - name: REDIS_HOST
              value: plane-app-redis.plane.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOG_USER_INFO
              value: "false"
          ports:
            - name: http
              containerPort: 8211
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: plane-mcp
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-mcp
    app.kubernetes.io/part-of: plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: plane-mcp
  ports:
    - name: http
      port: 8211
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-mcp
  namespace: plane
  labels:
    app.kubernetes.io/name: plane-mcp
    app.kubernetes.io/part-of: plane
spec:
  ingressClassName: traefik
  rules:
    - host: mcp.work.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-mcp
                port:
                  name: http
    - host: mcp.work.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-mcp
                port:
                  name: http
